<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .heads {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .head {
      position: absolute;
      left: 0;
      display: block;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      overflow: hidden;
      cursor: pointer;
      will-change: transform;
    }

    .head img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      pointer-events: none;
      filter: grayscale(1) contrast(1.25) brightness(0.88);
      animation: shake 0.12s linear infinite;
    }

    .head-2 img { animation-delay: -0.04s; }
    .head-3 img { animation-delay: -0.08s; }
    .head-4 img { animation-delay: -0.02s; }

    .head-1 {
      top: 6%;
      animation: drift 4s linear infinite alternate;
    }

    .head-2 {
      top: 28%;
      width: 180px;
      height: 180px;
      animation: drift 5.5s linear infinite alternate;
      animation-delay: -2s;
    }

    .head-3 {
      top: 50%;
      width: 260px;
      height: 260px;
      animation: drift 3.5s linear infinite alternate;
      animation-delay: -1s;
    }

    .head-4 {
      top: 74%;
      width: 160px;
      height: 160px;
      animation: drift 5s linear infinite alternate;
      animation-delay: -3s;
    }

    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(calc(100vw - 100%)); }
    }

    @keyframes shake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-3px, 2px); }
      40% { transform: translate(3px, -2px); }
      60% { transform: translate(-2px, -3px); }
      80% { transform: translate(2px, 3px); }
    }
  </style>
</head>
<body>
  <div class="heads">
    <a class="head head-1" href="head-1.html"><img src="酒店经理.png" alt=""></a>
    <a class="head head-2" href="head-2.html"><img src="酒店经理.png" alt=""></a>
    <a class="head head-3" href="head-3.html"><img src="酒店经理.png" alt=""></a>
    <a class="head head-4" href="head-4.html"><img src="酒店经理.png" alt=""></a>
  </div>
</body>
</html>
