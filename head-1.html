<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>内部登录</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #000;
      color: #d0d0d0;
      font-family: "Microsoft YaHei", "SimHei", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    .login {
      width: 320px;
      padding: 36px 32px 28px;
      border: 1px solid #4a4a4a;
      background: #0a0a0a;
    }

    .login-face {
      display: block;
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 18%;
      filter: grayscale(1) contrast(1.2);
      border: 1px solid #666;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.28em;
      text-align: center;
      color: #f2f2f2;
    }

    .sub {
      margin: 0 0 28px;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.16em;
      color: #888;
    }

    label {
      display: block;
      margin-bottom: 14px;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: #bdbdbd;
    }

    input {
      display: block;
      width: 100%;
      margin-top: 6px;
      padding: 8px 10px;
      box-sizing: border-box;
      border: 1px solid #555;
      background: #000;
      color: #f0f0f0;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: #ccc;
    }

    button {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid #cfcfcf;
      background: #111;
      color: #f5f5f5;
      font: inherit;
      letter-spacing: 0.32em;
      cursor: pointer;
    }

    button:hover {
      background: #f5f5f5;
      color: #111;
    }

    .status {
      min-height: 1.6em;
      margin: 14px 0 0;
      text-align: center;
      font-size: 12px;
      color: #9a9a9a;
    }
  </style>
</head>
<body>
  <form class="login" id="loginForm">
    <img class="login-face" src="酒店经理.png" alt="">
    <h1>张旭</h1>
    <p class="sub">内部终端 · 身份核验</p>
    <label>
      用户 ID
      <input type="text" name="uid" autocomplete="off" spellcheck="false">
    </label>
    <label>
      密码
      <input type="password" name="pwd" autocomplete="off">
    </label>
    <button type="submit">登录</button>
    <p class="status" id="status" role="status"></p>
  </form>
  <script>
    const form = document.getElementById("loginForm");
    const status = document.getElementById("status");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const uid = form.uid.value.trim();
      const pwd = form.pwd.value.trim();

      if (!uid || !pwd) {
        status.textContent = "请输入用户 ID 与密码。";
        return;
      }

      status.textContent = "核验失败。";
    });
  </script>
</body>
</html>
